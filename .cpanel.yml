---
deployment:
  tasks:
    - /bin/cp -R app /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -R bootstrap /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -R config /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -R database /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -R resources /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -R routes /home/livejobs/landing.livejobsbd.com/

    - /bin/cp -f artisan /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -f composer.json /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -f composer.lock /home/livejobs/landing.livejobsbd.com/

    - /bin/cp -f package.json /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -f vite.config.js /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -f postcss.config.js /home/livejobs/landing.livejobsbd.com/
    - /bin/cp -f tailwind.config.js /home/livejobs/landing.livejobsbd.com/

    # Public folder
    - /bin/cp -R public /home/livejobs/landing.livejobsbd.com/

    # Database migration
    - cd /home/livejobs/landing.livejobsbd.com && php artisan migrate --force

    # Laravel optimization
    - cd /home/livejobs/landing.livejobsbd.com && php artisan optimize
